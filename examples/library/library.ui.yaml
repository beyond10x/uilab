format: ess-ui/1
app: library
title: Lending library
model: library
placement_profile: fat
fixtures: {dir: fixtures, index: fixtures/index.yaml}
shells:
  app:
    regions:
      nav:
        kind: navigation
        props:
          collapsible: true
      account:
        kind: account_menu
        props:
          reads: {view: staff.Me}
      main:
        kind: page_outlet
      overlay:
        kind: overlay_outlet
      notify:
        kind: notifications
navigation:
  home: overview
  sections:
    - name: circulation
      label: Circulation
      icon: books
      pages: [overview, loans]
    - name: people
      label: People
      icon: members
      pages: [members]
pages:
  overview:
    kind: dashboard_page
    title: Overview
    sections:
      - {name: board, remove: true}
      - name: on_loan
        component: metric
        label: Copies on loan
        reads: {view: loans.Summary}
        from: on_loan
      - name: recent
        component: collection
        reads: {view: loans.All, params: {size: 5}}
        columns: [{field: title}, {field: member}, {field: due}]
  loans:
    kind: list_page
    title: Loans
    sections:
      - name: list
        component: collection
        reads: {view: loans.All, paging: server}
        columns: [{field: title}, {field: member}, {field: due}, {field: state, as: badge}]
        row_actions: [{opens: edit, label: Extend}]
    overlays:
      edit:
        kind: drawer
        component: form
        title: Extend loan
        does: loans.ExtendLoan
        fields: [due]
  members:
    kind: list_page
    title: Members
    sections:
      - name: list
        component: collection
        reads: {view: members.All}
        columns: [{field: name}, {field: joined}, {field: loans}, {field: standing, as: badge}]
