domain: uilab.wire

summary: >-
  What travels between the browser and the uilab server over one WebSocket. Audio travels as binary
  frames of 16 kHz mono little-endian f32 samples between `mic` open and `mic` closed; everything else is one
  JSON message per text frame, tagged by `type`.

types:
  - name: uilab.wire.OutlineNode
    kind: struct
    fields:
      - name: path
        type: uilab.session.NodePath
      - name: layer
        type: String
      - name: name
        type: String
      - name: kind
        type: String
      - name: title
        type: Optional<String>
      - name: view
        type: Optional<String>
      - name: props
        type: Optional<Json>
      - name: children
        type: List<uilab.wire.OutlineNode>

  - name: uilab.wire.Severity
    kind: enum
    variants: [error, warning]

  - name: uilab.wire.Finding
    kind: struct
    fields:
      - name: check
        type: String
      - name: severity
        type: uilab.wire.Severity
      - name: path
        type: String
      - name: message
        type: String

  - name: uilab.wire.Rows
    kind: struct
    fields:
      - name: view
        type: String
      - name: total
        type: Optional<Integer>
      - name: rows
        type: List<Json>

  # Client to server.
  - name: uilab.wire.Select
    kind: struct
    fields:
      - name: path
        type: uilab.session.NodePath

  - name: uilab.wire.MicState
    kind: enum
    variants: [open, closed]

  - name: uilab.wire.Mic
    kind: struct
    fields:
      - name: state
        type: uilab.wire.MicState

  - name: uilab.wire.Say
    kind: struct
    fields:
      - name: text
        type: String

  - name: uilab.wire.Decide
    kind: struct
    fields:
      - name: proposal_id
        type: uilab.session.ProposalId

  - name: uilab.wire.ReadRows
    kind: struct
    fields:
      - name: view
        type: String

  - name: uilab.wire.ClientMessage
    kind: union
    tag: type
    variants:
      select: uilab.wire.Select
      mic: uilab.wire.Mic
      say: uilab.wire.Say
      accept: uilab.wire.Decide
      reject: uilab.wire.Decide
      undo: uilab.wire.Decide
      rows: uilab.wire.ReadRows

  # Server to client.
  - name: uilab.wire.DocumentState
    kind: struct
    fields:
      - name: document_id
        type: uilab.session.DocumentId
      - name: file
        type: String
      - name: title
        type: Optional<String>
      - name: selected
        type: uilab.session.NodePath
      - name: outline
        type: uilab.wire.OutlineNode
      - name: findings
        type: List<uilab.wire.Finding>
      - name: undoable
        type: Optional<uilab.session.ProposalId>

  - name: uilab.wire.Transcript
    kind: struct
    fields:
      - name: text
        type: String
      - name: audio_ms
        type: Integer
      - name: took_ms
        type: Integer

  - name: uilab.wire.Thinking
    kind: struct
    fields:
      - name: target
        type: uilab.session.NodePath

  - name: uilab.wire.ProposalShown
    kind: struct
    fields:
      - name: proposal_id
        type: uilab.session.ProposalId
      - name: target
        type: uilab.session.NodePath
      - name: changed
        type: uilab.session.NodePath
      - name: op
        type: uilab.session.PatchOp
      - name: utterance
        type: String
      - name: before
        type: String
      - name: after
        type: String
      - name: findings
        type: List<uilab.wire.Finding>
      - name: outline
        type: uilab.wire.OutlineNode

  - name: uilab.wire.Refused
    kind: struct
    fields:
      - name: check
        type: String
      - name: message
        type: String

  - name: uilab.wire.Failed
    kind: struct
    fields:
      - name: message
        type: String

  - name: uilab.wire.ServerMessage
    kind: union
    tag: type
    variants:
      document: uilab.wire.DocumentState
      transcript: uilab.wire.Transcript
      thinking: uilab.wire.Thinking
      proposal: uilab.wire.ProposalShown
      refused: uilab.wire.Refused
      failed: uilab.wire.Failed
      rows: uilab.wire.Rows
