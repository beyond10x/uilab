domain: uilab.wire

summary: >-
  What travels between the browser and the uilab server over one WebSocket. Audio travels as binary
  frames of 16 kHz mono little-endian f32 samples between `mic` open and `mic` closed; everything else is one
  JSON message per text frame, tagged by `type`.

types:
  - name: uilab.wire.OutlineNode
    kind: struct
    fields:
      - name: path
        type: uilab.session.NodePath
      - name: layer
        type: String
      - name: name
        type: String
      - name: kind
        type: String
      - name: title
        type: Optional<String>
      - name: view
        type: Optional<String>
      - name: props
        type: Optional<Json>
      - name: inherited
        type: Optional<Boolean>
      - name: children
        type: List<uilab.wire.OutlineNode>

  - name: uilab.wire.Severity
    kind: enum
    variants: [error, warning]

  - name: uilab.wire.Finding
    kind: struct
    fields:
      - name: check
        type: String
      - name: severity
        type: uilab.wire.Severity
      - name: path
        type: String
      - name: message
        type: String

  - name: uilab.wire.Rows
    kind: struct
    fields:
      - name: view
        type: String
      - name: total
        type: Optional<Integer>
      - name: rows
        type: List<Json>
      - name: sample
        type: Optional<Boolean>

  # Client to server.
  - name: uilab.wire.Select
    kind: struct
    fields:
      - name: path
        type: uilab.session.NodePath

  - name: uilab.wire.MicState
    kind: enum
    variants: [open, closed]

  - name: uilab.wire.Workspace
    kind: enum
    variants: [app, components]

  - name: uilab.wire.Mic
    kind: struct
    fields:
      - name: state
        type: uilab.wire.MicState
      - name: workspace
        type: Optional<uilab.wire.Workspace>

  - name: uilab.wire.Say
    kind: struct
    fields:
      - name: text
        type: String
      - name: target
        type: Optional<uilab.session.NodePath>
      - name: review
        type: Optional<Boolean>
      - name: workspace
        type: Optional<uilab.wire.Workspace>

  - name: uilab.wire.Settings
    kind: struct
    fields:
      - name: review
        type: Boolean

  - name: uilab.wire.OperatorKind
    kind: enum
    variants: [human, agent]

  - name: uilab.wire.Hello
    kind: struct
    fields:
      - name: name
        type: String
      - name: kind
        type: uilab.wire.OperatorKind

  - name: uilab.wire.Resync
    kind: struct
    fields:
      - name: revision
        type: Integer

  - name: uilab.wire.Decide
    kind: struct
    fields:
      - name: proposal_id
        type: uilab.session.ProposalId

  - name: uilab.wire.ReadRows
    kind: struct
    fields:
      - name: view
        type: String

  - name: uilab.wire.StartGoal
    kind: struct
    fields:
      - name: text
        type: String
      - name: target
        type: Optional<uilab.session.NodePath>
      - name: max_steps
        type: Optional<Integer>
      - name: review
        type: Optional<Boolean>
      - name: workspace
        type: Optional<uilab.wire.Workspace>

  - name: uilab.wire.StopGoal
    kind: struct
    fields:
      - name: goal_id
        type: String

  - name: uilab.wire.ClientMessage
    kind: union
    tag: type
    variants:
      select: uilab.wire.Select
      mic: uilab.wire.Mic
      say: uilab.wire.Say
      accept: uilab.wire.Decide
      reject: uilab.wire.Decide
      undo: uilab.wire.Decide
      rows: uilab.wire.ReadRows
      hello: uilab.wire.Hello
      resync: uilab.wire.Resync
      settings: uilab.wire.Settings
      goal: uilab.wire.StartGoal
      stop_goal: uilab.wire.StopGoal

  # Server to client.
  - name: uilab.wire.Operator
    kind: struct
    fields:
      - name: id
        type: String
      - name: name
        type: String
      - name: kind
        type: uilab.wire.OperatorKind
      - name: last_seen_ms
        type: Integer

  - name: uilab.wire.Presence
    kind: struct
    fields:
      - name: operators
        type: List<uilab.wire.Operator>
      - name: selected_by
        type: Optional<String>

  - name: uilab.wire.Changed
    kind: struct
    fields:
      - name: revision
        type: Integer
      - name: by
        type: String
      - name: op
        type: uilab.session.PatchOp
      - name: changed
        type: uilab.session.NodePath
      - name: parent
        type: uilab.session.NodePath
      - name: node
        type: Optional<uilab.wire.OutlineNode>
      - name: findings
        type: List<uilab.wire.Finding>

  - name: uilab.wire.DocumentState
    kind: struct
    fields:
      - name: document_id
        type: uilab.session.DocumentId
      - name: file
        type: String
      - name: title
        type: Optional<String>
      - name: selected
        type: uilab.session.NodePath
      - name: outline
        type: uilab.wire.OutlineNode
      - name: findings
        type: List<uilab.wire.Finding>
      - name: undoable
        type: Optional<uilab.session.ProposalId>
      - name: revision
        type: Integer
      - name: review
        type: Boolean

  - name: uilab.wire.Transcript
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: text
        type: String
      - name: audio_ms
        type: Integer
      - name: took_ms
        type: Integer

  - name: uilab.wire.Thinking
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: target
        type: uilab.session.NodePath

  - name: uilab.wire.ProposalShown
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: proposal_id
        type: uilab.session.ProposalId
      - name: target
        type: uilab.session.NodePath
      - name: changed
        type: uilab.session.NodePath
      - name: op
        type: uilab.session.PatchOp
      - name: utterance
        type: String
      - name: before
        type: String
      - name: after
        type: String
      - name: findings
        type: List<uilab.wire.Finding>
      - name: outline
        type: uilab.wire.OutlineNode

  - name: uilab.wire.Refused
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: check
        type: String
      - name: message
        type: String

  - name: uilab.wire.Failed
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: message
        type: String

  - name: uilab.wire.Moved
    kind: struct
    fields:
      - name: by
        type: Optional<String>
      - name: selected_by
        type: String
      - name: from
        type: uilab.session.NodePath
      - name: to
        type: uilab.session.NodePath
      - name: reason
        type: String
      - name: navigate_only
        type: Boolean
      - name: utterance
        type: String

  - name: uilab.wire.GoalState
    kind: enum
    variants: [planning, running, done, stopped, failed]

  - name: uilab.wire.StepStatus
    kind: enum
    variants: [pending, thinking, proposed, accepted, rejected, refused, declined]

  - name: uilab.wire.GoalStep
    kind: struct
    fields:
      - name: instruction
        type: String
      - name: target
        type: uilab.session.NodePath
      - name: why
        type: String
      - name: status
        type: uilab.wire.StepStatus
      - name: proposal_id
        type: Optional<uilab.session.ProposalId>

  - name: uilab.wire.Goal
    kind: struct
    fields:
      - name: goal_id
        type: String
      - name: by
        type: String
      - name: text
        type: String
      - name: state
        type: uilab.wire.GoalState
      - name: steps
        type: List<uilab.wire.GoalStep>
      - name: current
        type: Optional<Integer>
      - name: message
        type: Optional<String>

  - name: uilab.wire.ServerMessage
    kind: union
    tag: type
    variants:
      document: uilab.wire.DocumentState
      transcript: uilab.wire.Transcript
      thinking: uilab.wire.Thinking
      proposal: uilab.wire.ProposalShown
      refused: uilab.wire.Refused
      failed: uilab.wire.Failed
      moved: uilab.wire.Moved
      rows: uilab.wire.Rows
      presence: uilab.wire.Presence
      changed: uilab.wire.Changed
      goal: uilab.wire.Goal
