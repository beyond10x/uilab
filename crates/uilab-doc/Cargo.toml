[package]
name = "uilab-doc"
description = "The ess-ui/1 document as uilab edits it: ESS loads and checks it; uilab keeps node paths, patches, outline and sample rows."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ess-ui = { git = "https://github.com/beyond10x/ess", rev = "5dbda40be9d30687c347f54f2b617718a094c2eb" }
ess-ui-check = { git = "https://github.com/beyond10x/ess", rev = "5dbda40be9d30687c347f54f2b617718a094c2eb" }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["arbitrary_precision"] }
