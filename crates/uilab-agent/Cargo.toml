[package]
name = "uilab-agent"
description = "Turns one spoken instruction into one admitted patch of a ui-spec/1 document, through one harness agent run."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "uilab-propose"
path = "src/bin/uilab-propose.rs"

[dependencies]
uilab-doc = { workspace = true }
harness-loop = { package = "b10x-harness-loop", git = "https://github.com/beyond10x/harness", tag = "0.15.1" }
harness-wire = { package = "b10x-harness-wire", git = "https://github.com/beyond10x/harness", tag = "0.15.1" }
harness-llm = { package = "b10x-harness-llm", git = "https://github.com/beyond10x/harness", tag = "0.15.1" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
